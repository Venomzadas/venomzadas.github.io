async function tok(q,b){const r=await fetch(U+'/auth/v1/token?'+q,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)return false;const j=await r.json();S={a:j.access_token,r:j.refresh_token,e:Date.now()+j.expires_in*1e3};localStorage.setItem('bc_s',JSON.stringify(S));if(ws&&ws.readyState===1)ws.send(JSON.stringify({topic:'realtime:bc',event:'access_token',payload:{access_token:S.a},ref:'t'}));return true}
